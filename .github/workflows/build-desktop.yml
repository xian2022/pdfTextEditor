name: Build Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # npm run build 会通过 prebuild 自动下载中文字体并复制 worker
      - run: npm run build

      # macOS：目录版 + ad-hoc 临时签名 + 自建 dmg/zip
      # （无 Apple 开发者证书，临时签名可避免"已损坏"，首次打开右键→打开即可）
      - name: 打包 macOS（目录版 + 临时签名）
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dir --publish never
          APP=$(find release -maxdepth 2 -name "*.app" | head -1)
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          VERSION=$(node -p "require('./package.json').version")
          hdiutil create -volname PDFTextEditor -srcfolder "$APP" -ov -format UDZO "release/PDFTextEditor-${VERSION}-mac.dmg"
          ditto -c -k --keepParent "$APP" "release/PDFTextEditor-${VERSION}-mac.zip"

      - name: 打包 Windows/Linux
        if: runner.os != 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-text-editor-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
